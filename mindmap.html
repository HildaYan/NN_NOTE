<div class="note"><b>怎麼讀:</b>中間是整門課;往外一層是 12 個<b>主題</b>(基本元件、架構、學習方式、各類網路、設計與調參、怎麼選網路…),再往外是<b>子主題</b>(點了跳到該講筆記),最外層是<b>細節與公式</b>。每個主題旁邊有一張<b>便利貼</b>寫這個主題的一句話重點;<b>虛線</b>代表不同主題之間的關聯(例如 k-means 同時出現在 RBF 與 SOM)。</div>
